<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ассистент</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg:     var(--tg-theme-bg-color, #1c1c1e);
      --text:   var(--tg-theme-text-color, #ffffff);
      --hint:   var(--tg-theme-hint-color, #8e8e93);
      --btn:    var(--tg-theme-button-color, #3478f6);
      --btn-t:  var(--tg-theme-button-text-color, #ffffff);
      --sec-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
    }
    .bubble {
      max-width: 84%;
      padding: 9px 13px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--btn);
      color: var(--btn-t);
      border-bottom-right-radius: 4px;
    }
    .bubble.bot {
      align-self: flex-start;
      background: var(--sec-bg);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .bubble.typing {
      align-self: flex-start;
      background: var(--sec-bg);
      color: var(--hint);
      font-style: italic;
      border-bottom-left-radius: 4px;
    }
    .welcome {
      text-align: center;
      padding: 28px 16px 12px;
      color: var(--hint);
    }
    .welcome h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .welcome p { font-size: 14px; line-height: 1.5; }
    .chips {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .chip {
      background: var(--sec-bg);
      color: var(--text);
      border: none;
      border-radius: 12px;
      padding: 9px 13px;
      font-size: 13.5px;
      text-align: left;
      cursor: pointer;
      line-height: 1.4;
      font-family: inherit;
      transition: opacity .15s;
    }
    .chip:active { opacity: .7; }
    #bar {
      padding: 8px 10px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      background: var(--sec-bg);
      display: flex;
      gap: 8px;
      align-items: flex-end;
      border-top: 1px solid rgba(128,128,128,.15);
    }
    #inp {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: none;
      border-radius: 20px;
      padding: 9px 15px;
      font-size: 15px;
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 38px;
      font-family: inherit;
      line-height: 1.4;
    }
    #inp::placeholder { color: var(--hint); }
    #send {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--btn);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity .15s;
    }
    #send:disabled { opacity: .35; cursor: default; }
    #send svg { fill: var(--btn-t); }
  </style>
</head>
<body>
<div id="messages">
  <div class="welcome" id="welcome">
    <h2>👋 Привет!</h2>
    <p>Спрашивай что угодно — отвечу с ИИ.<br>Могу искать в интернете и смотреть заправки.</p>
    <div class="chips">
      <button class="chip" onclick="quickSend(this)">🚗 Как обстановка на М-12 по заправкам от Москвы до Казани?</button>
      <button class="chip" onclick="quickSend(this)">🐕 Где купить товары для собак у метро Метрогородок?</button>
      <button class="chip" onclick="quickSend(this)">🌤 Какая погода в Москве на выходные?</button>
    </div>
  </div>
</div>
<div id="bar">
  <textarea id="inp" placeholder="Спроси что угодно…" rows="1"></textarea>
  <button id="send" onclick="send()">
    <svg width="17" height="17" viewBox="0 0 24 24"><path d="M2 21 23 12 2 3l-.01 7 15 2-15 2z"/></svg>
  </button>
</div>
<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const msgEl = document.getElementById('messages');
const inp = document.getElementById('inp');
const btn = document.getElementById('send');
let history = [];
let busy = false;
inp.addEventListener('input', () => {
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
});
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
function quickSend(b) { inp.value = b.textContent.trim(); send(); }
function addBubble(role, text) {
  document.getElementById('welcome')?.remove();
  const d = document.createElement('div');
  d.className = 'bubble ' + role;
  d.textContent = text;
  msgEl.appendChild(d);
  msgEl.scrollTop = msgEl.scrollHeight;
  return d;
}
function addTyping() {
  const d = document.createElement('div');
  d.className = 'bubble typing';
  d.id = 'typing';
  d.textContent = 'Думаю…';
  msgEl.appendChild(d);
  msgEl.scrollTop = msgEl.scrollHeight;
  return d;
}
async function send() {
  const text = inp.value.trim();
  if (!text || busy) return;
  busy = true;
  btn.disabled = true;
  inp.value = '';
  inp.style.height = 'auto';
  addBubble('user', text);
  const typing = addTyping();
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history })
    });
    const data = await res.json();
    typing.remove();
    if (data.error) {
      addBubble('bot', '❌ ' + data.error);
    } else {
      addBubble('bot', data.response);
      history.push(
        { role: 'user', parts: [{ text }] },
        { role: 'model', parts: [{ text: data.response }] }
      );
      if (history.length > 40) history = history.slice(-40);
    }
  } catch {
    typing.remove();
    addBubble('bot', '❌ Нет соединения. Попробуй ещё раз.');
  }
  busy = false;
  btn.disabled = false;
  inp.focus();
}
</script>
</body>
</html>
