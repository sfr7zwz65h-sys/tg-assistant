<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ассистент</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user {
    align-self: flex-end;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #fff);
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-start;
    background: var(--tg-theme-secondary-bg-color, #f1f1f1);
    border-bottom-left-radius: 4px;
  }
  .typing { opacity: 0.6; font-style: italic; }
  #suggestions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 0 12px 8px;
  }
  #suggestions button {
    padding: 10px 14px;
    border: 1px solid var(--tg-theme-button-color, #2481cc);
    background: transparent;
    color: var(--tg-theme-button-color, #2481cc);
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
  }
  #inputbar {
    display: flex;
    gap: 8px;
    padding: 8px 12px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    background: var(--tg-theme-bg-color, #fff);
    border-top: 1px solid var(--tg-theme-secondary-bg-color, #f1f1f1);
    align-items: flex-end;
  }
  #input {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: var(--tg-theme-secondary-bg-color, #f1f1f1);
    color: var(--tg-theme-text-color, #000);
    border-radius: 18px;
    padding: 10px 14px;
    font-size: 15px;
    font-family: inherit;
    max-height: 120px;
  }
  #input::placeholder { color: var(--tg-theme-hint-color, #999); }
  #send {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send:disabled { opacity: 0.5; }
</style>
</head>
<body>
  <div id="chat"></div>
  <div id="suggestions"></div>
  <div id="inputbar">
    <textarea id="input" rows="1" placeholder="Напишите сообщение…"></textarea>
    <button id="send">➤</button>
  </div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const chatEl = document.getElementById("chat");
  const sugEl = document.getElementById("suggestions");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  // История в формате Gemini: [{role, parts:[{text}]}], максимум 40 элементов (20 пар)
  const history = [];
  const MAX_HISTORY = 40;

  function addMsg(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  // Приветствие + кнопки-примеры
  addMsg("Привет! 👋 Я твой личный ассистент. Могу найти что угодно в интернете и подсказать обстановку с заправками на трассе.", "bot");
  const EXAMPLES = [
    "⛽ Что с бензином на М-12?",
    "🌤 Какая погода в Казани?",
    "🛒 Где купить зарядку для iPhone рядом с Владимиром?",
  ];
  EXAMPLES.forEach((ex) => {
    const b = document.createElement("button");
    b.textContent = ex;
    b.onclick = () => { sugEl.innerHTML = ""; send(ex.replace(/^\S+\s/, "")); };
    sugEl.appendChild(b);
  });

  async function send(text) {
    const message = (text || inputEl.value).trim();
    if (!message) return;
    inputEl.value = "";
    inputEl.style.height = "auto";
    sugEl.innerHTML = "";
    sendBtn.disabled = true;

    addMsg(message, "user");
    const typingEl = addMsg("Печатает…", "bot typing");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history }),
      });
      const data = await res.json();
      typingEl.remove();

      if (data.response) {
        addMsg(data.response, "bot");
        history.push({ role: "user", parts: [{ text: message }] });
        history.push({ role: "model", parts: [{ text: data.response }] });
        while (history.length > MAX_HISTORY) history.shift();
      } else {
        addMsg("⚠️ " + (data.error || "Что-то пошло не так, попробуйте ещё раз."), "bot");
      }
    } catch (e) {
      typingEl.remove();
      addMsg("⚠️ Ошибка сети. Проверьте соединение и попробуйте снова.", "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.onclick = () => send();
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });
</script>
</body>
</html>
